name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Test, lint, type-check, and build
    runs-on: ubuntu-latest
    env:
      PLATFORM_OWNER_EMAIL: ci@wisal.invalid
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run runtime contract tests
        run: node --test tests/*.test.mjs

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build production application
        run: npm run build
